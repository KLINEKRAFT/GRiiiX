:32px;height:32px;border-radius:9px;background:#e7edf7;color:var(--blue);font-weight:800}.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;min-height:41px}.btn.alt{background:#edf1f7;color:var(--blue)}.btn.white{background:#fff;color:var(--blue)}.btn.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.btn.small{font-size:12px;min-height:33px;padding:7px 11px}.section{margin:24px 0 12px}.pill{font-size:10px;font-weight:750;color:#22548a;background:#eef3fa;padding:5px 9px;border-radius:15px;white-space:nowrap}.pill.success{color:#2d7552;background:#eaf5ee}.hint{padding:14px;border-radius:12px;background:#edf3fb;color:#4c6180;font-size:12px;line-height:1.5}.warning{padding:13px;border-left:3px solid #b88740;border-radius:0 8px 8px 0;background:#fff9ee;font-size:12px;color:#785d34}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#657184;margin-bottom:12px}.field input,.field select,.field textarea{background:white;border:1px solid #dbe1e7;border-radius:10px;padding:12px;color:var(--ink);outline-color:var(--blue);font-size:14px;min-width:0;width:100%}.field textarea{min-height:70px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}.rule{border:0;border-top:1px solid var(--line);margin:14px 0}.empty{text-align:center;padding:33px 15px;border:1px dashed #cbd3de;border-radius:15px;color:var(--muted);font-size:13px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.photo{aspect-ratio:1;border:0;border-radius:8px;overflow:hidden;background:#e7ebf0;padding:0}.photo img{display:block;width:100%;height:100%;object-fit:cover}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:3;display:flex;justify-content:center;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.nav button{background:transparent;border:0;border-radius:10px;font-size:10px;color:#838b98;padding:8px 0 6px;font-weight:700}.nav button strong{display:block;font-size:17px;font-weight:550}.nav button.active{background:#e8eff8;color:var(--blue)}.plot{background:#f0f3f7;width:100%;border-radius:11px;height:180px;margin:12px 0}.kpi{font-size:30px;font-weight:750;letter-spacing:-1px}.fileinput{display:none}.link{color:var(--blue)}@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.gallery{grid-template-columns:repeat(5,1fr)}}
</style><link rel="stylesheet" href="adaptive.css"><link rel="stylesheet" href="studio.css"></head><body><div class="main"><header class="header"><div class="brand">KLINEKRAFT <span>/ GR</span></div><div class="logo">K.</div></header><div id="screen"></div></div><nav class="bottom"><div class="nav" id="nav"></div></nav><input id="images" type="file" class="fileinput" accept="image/*,.dng" multiple><input id="recipefile" type="file" class="fileinput" accept=".json,application/json"><script>
'use strict';
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('kkgr:'+k))??d}catch{return d}};const save=(k,v)=>localStorage.setItem('kkgr:'+k,JSON.stringify(v));const stamp=t=>new Date(t).toLocaleDateString();const size=n=>(n/1048576).toFixed(1)+' MB';
const sample=[{id:'halloween',name:'Halloween Night',shutter:'1/125',aperture:'f/2.8',iso:'Auto · max 6400',look:'Positive Film',note:'Costumes, jack-o-lanterns, porches and streetlights.'},{id:'street',name:'Street Daylight',shutter:'1/250',aperture:'f/5.6',iso:'Auto · max 1600',look:'Positive Film',note:'Everyday bright street photographs.'},{id:'golden',name:'Golden Hour',shutter:'1/125',aperture:'f/2.8',iso:'Auto · max 3200',look:'Standard',note:'Warm light and portraits.'},{id:'noir',name:'Midnight Noir',shutter:'1/60',aperture:'f/2.8',iso:'Auto · max 12800',look:'Hi-Contrast B&W',note:'Streetlights, silhouettes and deep shadows.'}];
let state={page:'home',recipes:read('recipes',sample),active:read('active','halloween'),photos:[],walks:read('walks',[]),current:read('current',null),watch:null,edit:null,detail:null,timer:null,remaining:0,scene:'people'};
const button=(label,act,style='')=>'<button class="btn '+style+'" data-action="'+act+'">'+safe(label)+'</button>';const heading=(title,desc)=>'<div class="eyebrow">GR IIIx COMPANION</div><h1>'+title+'</h1><p class="lead">'+desc+'</p>';const recipe=()=>state.recipes.find(r=>r.id===state.active)||state.recipes[0];
function home(){const r=recipe();return heading('Take better pictures.','A personal field companion for the Ricoh GR IIIx.')+'<div class="hero"><div class="eyebrow">CURRENT SHOOTING PROFILE</div><h2>'+safe(r.name)+'</h2><div class="metrics"><div class="metric"><small>SHUTTER</small><b>'+safe(r.shutter)+'</b></div><div class="metric"><small>APERTURE</small><b>'+safe(r.aperture)+'</b></div><div class="metric"><small>ISO</small><b style="font-size:12px">'+safe(r.iso)+'</b></div></div><div class="flex" style="margin-top:14px">'+button('Manage recipes','recipes','white')+'</div></div><div class="warning">These are reference settings. The current web app does not change settings on the physical camera.</div><div class="section spread"><h2>Quick access</h2></div><div class="grid"><div class="tile" data-page="recipes"><div class="ico">R</div><b>Recipes</b><span class="muted">Save shooting looks</span></div><div class="tile" data-page="library"><div class="ico">L</div><b>Library</b><span class="muted">Keep photos locally</span></div><div class="tile" data-page="walks"><div class="ico">W</div><b>Photo walks</b><span class="muted">GPS field journal</span></div><div class="tile" data-page="studio"><div class="ico">S</div><b>Studio</b><span class="muted">Light and timer tools</span></div></div><div class="section"><h2>Camera Wi-Fi</h2></div><div class="card"><div class="spread"><b>GR IIIx</b><span class="pill">Control bridge needed</span></div><p class="muted">Safari can test the camera’s HTTP endpoint in a new tab, but the secure Vercel app cannot reliably send it commands directly.</p><div class="flex">'+button('Test camera address','ping')+button('How to connect','help','ghost')+'</div></div>'}
function recipes(){return heading('Film recipes.','Create, save, and export your personal shooting settings.')+'<div class="spread"><span class="pill">'+state.recipes.length+' recipes</span>'+button('+ New recipe','new')+'</div>'+state.recipes.map(r=>'<div class="card"><div class="spread"><h3>'+safe(r.name)+'</h3><span class="pill '+(r.id===state.active?'success':'')+'">'+(r.id===state.active?'Selected':'Saved')+'</span></div><p class="muted">'+safe(r.look)+' · '+safe(r.shutter)+' · '+safe(r.aperture)+' · '+safe(r.iso)+'</p><p class="muted">'+safe(r.note)+'</p><div class="flex"><button class="btn small" data-select="'+safe(r.id)+'">Select</button><button class="btn small ghost" data-edit="'+safe(r.id)+'">Edit</button><button class="btn small ghost" data-delete="'+safe(r.id)+'">Delete</button></div></div>').join('')+'<div class="flex">'+button('Export recipes','export','ghost')+button('Import recipes','import','ghost')+'</div><p class="hint">All recipes are stored locally on your device. Remote camera application is a future feature.</p>'}
function edit(){const r=state.recipes.find(x=>x.id===state.edit)||{name:'',shutter:'1/125',aperture:'f/2.8',iso:'Auto · max 6400',look:'Positive Film',note:''};return heading('Recipe editor.','Customize a shooting profile.')+'<form id="editor" class="card"><div class="fields"><label class="field wide">Name<input name="name" required maxlength="60" value="'+safe(r.name)+'"></label><label class="field">Shutter<input name="shutter" value="'+safe(r.shutter)+'"></label><label class="field">Aperture<input name="aperture" value="'+safe(r.aperture)+'"></label><label class="field wide">ISO<input name="iso" value="'+safe(r.iso)+'"></label><label class="field wide">Film look<input name="look" value="'+safe(r.look)+'"></label><label class="field wide">Notes<textarea name="note">'+safe(r.note)+'</textarea></label></div><div class="flex"><button class="btn" type="submit">Save recipe</button>'+button('Cancel','recipes','ghost')+'</div></form>'}
function library(){return heading('Photo library.','Import files from your iPhone and organize them locally.')+'<div class="spread"><span class="pill">'+state.photos.length+' photos</span>'+button('Import photos','photos')+'</div><div class="section">'+(state.photos.length?'<div class="gallery">'+state.photos.slice().reverse().map(p=>'<button class="photo" data-photo="'+p.id+'"><img src="'+p.url+'" alt="'+safe(p.name)+'"></button>').join('')+'</div>':'<div class="empty">No imported photos yet.<p>Choose images from your photo library or Files.</p></div>')+'</div><p class="muted">Imported originals are saved in your browser’s IndexedDB, not uploaded to Vercel. iOS may purge website data under storage pressure; keep originals backed up elsewhere.</p>'}
function detail(){const p=state.photos.find(x=>x.id===state.detail);if(!p)return library();return heading('Your photograph.','Stored on this iPhone.')+'<div class="card"><img src="'+p.url+'" style="width:100%;max-height:60vh;object-fit:contain;border-radius:10px" alt="'+safe(p.name)+'"><h3 style="margin-top:12px">'+safe(p.name)+'</h3><p class="muted">'+size(p.size)+' · '+stamp(p.time)+'</p><div class="flex"><button class="btn" data-download="'+p.id+'">Download original</button><button class="btn ghost" data-remove="'+p.id+'">Remove</button>'+button('Back','library','ghost')+'</div></div>'}
function path(points){if(points.length<2)return '<div class="empty">GPS route preview appears after multiple points are captured.</div>';let xs=points.map(p=>p.lon),ys=points.map(p=>p.lat),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),dx=Math.max(.00001,maxX-minX),dy=Math.max(.00001,maxY-minY);let d=points.map((p,i)=>(i?'L':'M')+(20+(p.lon-minX)*305/dx)+','+(163-(p.lat-minY)*130/dy)).join(' ');return '<svg class="plot" viewBox="0 0 345 180" role="img" aria-label="Route preview; not a geographic map"><text x="15" y="18" font-size="10" fill="#8692a4">TRACK PREVIEW — NOT A MAP</text><path d="'+d+'" stroke="#002d72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'}
function walks(){return heading('Photo walks.','Keep a private GPS log of your favorite photography outings.')+(state.current?'<div class="card"><div class="spread"><h3>'+safe(state.current.name)+'</h3><span class="pill success">Recording</span></div><p class="muted">'+state.current.points.length+' GPS points recorded</p>'+path(state.current.points)+button('Stop and save','stopwalk')+'</div>':'<div class="card"><h3>New photo walk</h3><label class="field">Name<input id="walkname" placeholder="e.g. Downtown after dark"></label>'+button('Start GPS tracking','startwalk')+'</div>')+'<div class="section"><h2>Saved walks</h2></div>'+(state.walks.length?state.walks.slice().reverse().map(w=>'<div class="card"><div class="spread"><b>'+safe(w.name)+'</b><span class="muted">'+stamp(w.started)+'</span></div><p class="muted">'+w.points.length+' GPS points</p>'+path(w.points)+'<div class="flex"><button class="btn small ghost" data-gpx="'+w.id+'">Export GPX</button><button class="btn small ghost" data-deletewalk="'+w.id+'">Delete</button></div></div>').join(''):'<div class="empty">No walks recorded yet.</div>')+'<p class="muted">iOS may pause GPS updates when this web app goes into the background or the phone locks. Keep this screen open for reliable route recording.</p>'}
const scenes={people:['People walking','1/125','f/2.8','Auto · max 6400','Look for porch lights and keep faces illuminated.'],run:['Running kids','1/250','f/2.8','Auto · max 12800','Choose shutter speed over low noise.'],still:['Pumpkins & houses','1/15','f/2.8','Auto','Hold the camera steady; use for stationary subjects.'],portrait:['Posed portraits','1/60','f/2.8','Auto · max 6400','Have your subjects stay still and face the light.']};
function studio(){let s=scenes[state.scene];return heading('Studio tools.','Night photography guidance and capture timing tools.')+'<div class="card"><div class="eyebrow">NIGHT PHOTOGRAPHY ASSISTANT</div><h2 style="margin-top:8px">Exposure guide</h2><label class="field">Scene<select id="scene">'+Object.entries(scenes).map(([k,v])=>'<option value="'+k+'" '+(k===state.scene?'selected':'')+'>'+v[0]+'</option>').join('')+'</select></label><div class="grid" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="eyebrow">SHUTTER</div><div class="kpi">'+s[1]+'</div></div><div class="tile"><div class="eyebrow">APERTURE</div><div class="kpi">'+s[2]+'</div></div></div><p>'+s[3]+'</p><p class="muted">'+s[4]+'</p><p class="hint">These are reference settings, not remote camera controls.</p></div><div class="card"><div class="eyebrow">INTERVAL / PHOTO BOOTH GUIDE</div><h2 style="margin-top:8px">Capture prompt timer</h2><div class="fields"><label class="field">Seconds between prompts<input id="seconds" type="number" min="2" max="180" value="5"></label><label class="field">Prompts<input id="shots" type="number" min="1" max="99" value="5"></label></div><h1 id="counter">'+(state.timer?'Next: '+state.remaining+'s':'Ready')+'</h1><div class="flex">'+(state.timer?button('Stop timer','stoptimer','ghost'):button('Start timer','starttimer'))+'</div><p class="muted">Timer prompts do not trigger the GR IIIx shutter. The automated photo booth will require a camera bridge.</p></div>'}
function insights(){const total=state.photos.reduce((n,p)=>n+p.size,0);let types={};state.photos.forEach(p=>{let k=p.name.split('.').pop().toUpperCase();types[k]=(types[k]||0)+1});return heading('Your photography.','A local overview of your shooting library.')+'<div class="grid"><div class="tile"><span class="eyebrow">PHOTOS</span><div class="kpi">'+state.photos.length+'</div></div><div class="tile"><span class="eyebrow">RECIPES</span><div class="kpi">'+state.recipes.length+'</div></div><div class="tile"><span class="eyebrow">WALKS</span><div class="kpi">'+state.walks.length+'</div></div><div class="tile"><span class="eyebrow">STORAGE</span><div class="kpi" style="font-size:20px">'+size(total)+'</div></div></div><div class="section"><h2>Photo formats</h2></div><div class="card">'+(Object.keys(types).length?Object.entries(types).map(([k,v])=>'<div class="spread"><b>'+safe(k)+'</b><span>'+v+'</span></div><hr class="rule">').join(''):'<p class="muted">Import photographs to start collecting statistics.</p>')+'</div><div class="hint">EXIF exposure analysis and intelligent recommendations are planned, but are not implemented in this build.</div>'}
const pages={home,recipes,edit,library,detail,walks,studio,insights};const tablist=[['home','⌂','Home'],['recipes','▤','Recipes'],['library','▦','Library'],['walks','⌁','Walks'],['studio','◉','Studio'],['insights','▥','Insights']];function render(){if(!pages[state.page])state.page='home';const keepY=window.scrollY||0;$('#screen').innerHTML=pages[state.page]();const active=['walks','studio','insights','home'].includes(state.page)?'more':state.page;$('#nav').innerHTML=tablist.map(([k,i,n])=>'<button data-page="'+k+'" class="'+(active===k?'active':'')+'" aria-label="'+n+'" aria-current="'+(active===k?'page':'false')+'"><strong>'+i+'</strong>'+n+'</button>').join('');window.scrollTo(0,keepY)}function go(p){state.page=p;render();window.scrollTo(0,0)}
function download(blob,name,type){let a=document.createElement('a'),b=blob instanceof Blob?blob:new Blob([blob],{type:type||'application/json'});a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6000)}function db(){return new Promise((resolve,reject)=>{let r=indexedDB.open('kkgr-gallery',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function updatePhotos(){try{let d=await db(),rows=await new Promise((resolve,reject)=>{let r=d.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});state.photos.forEach(p=>URL.revokeObjectURL(p.url));state.photos=rows.map(p=>({...p,url:URL.createObjectURL(p.file)}));if(['library','detail','insights','home'].includes(state.page))render()}catch(e){console.warn(e)}}async function addPhotos(files){try{let d=await db();for(let f of files){if(!f.type.startsWith('image/')&&!f.name.toLowerCase().endsWith('.dng'))continue;await new Promise((resolve,reject)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put({id:String(Date.now())+Math.random().toString(36).slice(2),name:f.name,size:f.size,time:Date.now(),file:f});t.oncomplete=resolve;t.onerror=reject})}await updatePhotos();go('library')}catch(e){alert('Could not store these files. Try importing fewer photographs.')}}async function deletePhoto(id){let d=await db();await new Promise((resolve,reject)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=resolve;t.onerror=reject});await updatePhotos();go('library')}
function stopTracking(){if(state.watch!==null){navigator.geolocation.clearWatch(state.watch);state.watch=null}}function exportGpx(w){let pts=w.points.map(p=>'<trkpt lat="'+p.lat+'" lon="'+p.lon+'"><time>'+new Date(p.t).toISOString()+'</time></trkpt>').join('');download('<?xml version="1.0"?><gpx xmlns="http://www.topografix.com/GPX/1/1" version="1.1" creator="Klinekraft GR"><trk><name>'+safe(w.name)+'</name><trkseg>'+pts+'</trkseg></trk></gpx>','gr-photowalk.gpx','application/gpx+xml')}
function action(a){if(pages[a])return go(a);if(a==='new'){state.edit=null;return go('edit')}if(a==='photos')return $('#images').click();if(a==='import')return $('#recipefile').click();if(a==='export')return download(JSON.stringify(state.recipes,null,2),'gr-recipes.json');if(a==='ping')return window.open('http://192.168.0.1/v1/ping','_blank','noopener,noreferrer');if(a==='help')return alert('Turn on the GR IIIx Wi-Fi, connect your iPhone to its network, then open http://192.168.0.1/v1/ping in Safari. The Vercel app cannot control the camera directly.');if(a==='startwalk'){if(!navigator.geolocation)return alert('GPS unavailable');state.current={id:String(Date.now()),name:$('#walkname').value.trim()||'Photo walk',started:Date.now(),points:[]};save('current',state.current);state.watch=navigator.geolocation.watchPosition(pos=>{if(!state.current)return;let p={lat:pos.coords.latitude,lon:pos.coords.longitude,t:Date.now()},last=state.current.points.at(-1);if(!last||Math.abs(last.lat-p.lat)+Math.abs(last.lon-p.lon)>.00001){state.current.points.push(p);save('current',state.current);if(state.page==='walks')render()}},e=>alert('Location: '+e.message),{enableHighAccuracy:true,maximumAge:1500,timeout:20000});return render()}if(a==='stopwalk'){stopTracking();if(state.current){state.walks.push(state.current);save('walks',state.walks);state.current=null;save('current',null)}return render()}if(a==='starttimer'){let secs=Math.max(2,Math.min(180,Number($('#seconds').value)||5)),shots=Math.max(1,Math.min(99,Number($('#shots').value)||5));state.remaining=secs;state.timer=setInterval(()=>{state.remaining--;if(state.remaining<=0){shots--;if(navigator.vibrate)navigator.vibrate(100);state.remaining=secs;if(shots<=0){clearInterval(state.timer);state.timer=null}}if($('#counter'))$('#counter').textContent=state.timer?'Next: '+state.remaining+'s':'Done'},1000);return render()}if(a==='stoptimer'){clearInterval(state.timer);state.timer=null;return render()}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page]');if(el)return go(el.dataset.page);el=e.target.closest('[data-action]');if(el)return action(el.dataset.action);el=e.target.closest('[data-select]');if(el){state.active=el.dataset.select;save('active',state.active);return render()}el=e.target.closest('[data-edit]');if(el){state.edit=el.dataset.edit;return go('edit')}el=e.target.closest('[data-delete]');if(el){if(state.recipes.length===1)return alert('Keep at least one recipe');if(confirm('Delete this recipe?')){state.recipes=state.recipes.filter(r=>r.id!==el.dataset.delete);save('recipes',state.recipes);if(!state.recipes.some(r=>r.id===state.active)){state.active=state.recipes[0].id;save('active',state.active)}render()}return}el=e.target.closest('[data-photo]');if(el){state.detail=el.dataset.photo;return go('detail')}el=e.target.closest('[data-download]');if(el){let p=state.photos.find(p=>p.id===el.dataset.download);return p&&download(p.file,p.name,p.file.type)}el=e.target.closest('[data-remove]');if(el&&confirm('Remove photo from app?'))return deletePhoto(el.dataset.remove);el=e.target.closest('[data-gpx]');if(el){let w=state.walks.find(w=>w.id===el.dataset.gpx);return w&&exportGpx(w)}el=e.target.closest('[data-deletewalk]');if(el&&confirm('Delete this walk?')){state.walks=state.walks.filter(w=>w.id!==el.dataset.deletewalk);save('walks',state.walks);return render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='editor')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));let o={id:state.edit||String(Date.now()),name:String(d.name).trim(),shutter:String(d.shutter),aperture:String(d.aperture),iso:String(d.iso),look:String(d.look),note:String(d.note)};if(!o.name)return;if(state.edit)state.recipes=state.recipes.map(r=>r.id===state.edit?o:r);else state.recipes.push(o);save('recipes',state.recipes);go('recipes')});document.addEventListener('change',e=>{if(e.target.id==='scene'){state.scene=e.target.value;render()}});
$('#images').addEventListener('change',e=>{addPhotos([...e.target.files]);e.target.value=''});$('#recipefile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{let r=JSON.parse(await f.text());if(!Array.isArray(r)||!r.every(x=>x&&typeof x.name==='string'))throw Error();state.recipes.push(...r.slice(0,100).map(x=>({id:Math.random().toString(36).slice(2),name:String(x.name).slice(0,60),shutter:String(x.shutter||'1/125'),aperture:String(x.aperture||'f/2.8'),iso:String(x.iso||'Auto'),look:String(x.look||'Standard'),note:String(x.note||'')})));save('recipes',state.recipes);render()}catch{alert('Invalid recipe file')}e.target.value=''});
if(state.current){state.walks.push(state.current);save('walks',state.walks);state.current=null;save('current',null)}updatePhotos();render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(console.warn));
</script><script src="adaptive.js"></script></body></html>
